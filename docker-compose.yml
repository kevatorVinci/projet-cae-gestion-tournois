services:
  frontend:
    container_name: frontend-demo
    image: frontend-demo
    build:
      context: ./frontend
    ports:
      - "5172:5172"
    depends_on:
      - api

  api:
    container_name: api-demo
    image: api-demo
    build:
      context: ./api
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  db:
    image: postgres:14
    container_name: db-demo
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"

  reverse-proxy:
    container_name: reverse-proxy-demo
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf